<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>CHANNEL NAME — short</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Newsreader"; src: url("assets/Newsreader.ttf") format("truetype"); font-weight: 200 800; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0a1424; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #0a1424; color: #f2ecdf; font-family: "Space Mono", monospace; }
      .g { color: #39d98a; }
      .r { color: #ff5d4f; }
      #bg { position: absolute; inset: 0; background: #0a1424; overflow: hidden; }
      #bg .glow1 { position: absolute; width: 1400px; height: 1400px; left: -600px; top: 900px; border-radius: 50%;
        background: radial-gradient(circle, rgba(57,217,138,0.32) 0%, rgba(57,217,138,0) 62%); }
      #bg .glow2 { position: absolute; width: 1300px; height: 1300px; left: 300px; top: -500px; border-radius: 50%;
        background: radial-gradient(circle, rgba(59,123,255,0.30) 0%, rgba(59,123,255,0) 62%); }
      #bg .grid { position: absolute; inset: -120px; opacity: 0.14;
        background-image: linear-gradient(rgba(242,236,223,0.5) 2px, transparent 2px), linear-gradient(90deg, rgba(242,236,223,0.5) 2px, transparent 2px);
        background-size: 120px 120px; }
      #bgp { position: absolute; inset: 0; background: #f2ecdf; }
      #prog { position: absolute; left: 0; top: 0; width: 1080px; height: 14px; background: #39d98a; transform-origin: 0 50%; z-index: 20; }

      #ejcam { position: absolute; inset: 0; z-index: 2; transform-origin: 50% 36%; }
      .fgv { position: absolute; left: -948px; top: 246px; width: 2976px; height: 1674px; }
      #camcam { position: absolute; inset: 0; z-index: 2; }
      .camv { position: absolute; left: 0px; top: 1040px; width: 520px; height: 914px; }

      #camwin { position: absolute; left: 150px; top: 880px; width: 780px; height: 1040px; z-index: 2; overflow: hidden;
        border-radius: 40px 40px 0 0; box-shadow: 0 0 0 4px rgba(57,217,138,0.7), 0 -20px 60px rgba(0,0,0,0.5); }
      #cam { position: absolute; left: 0; top: 0; width: 780px; height: 1370px; }
      #scrwin { position: absolute; left: 40px; top: 400px; width: 1000px; height: 422px; z-index: 2; overflow: hidden;
        border-radius: 24px; box-shadow: 0 0 0 3px rgba(57,217,138,0.45), 0 24px 60px rgba(0,0,0,0.5); background: #000; }
      #scr { position: absolute; left: 0; top: 0; width: 1000px; height: 422px; transform-origin: 50% 50%; }
      .bword { position: absolute; left: 0; right: 0; top: 440px; height: 400px; z-index: 3; }
      .bwin { position: absolute; left: 0; right: 0; top: 0; text-align: center; font-family: "League Gothic"; font-size: 300px; line-height: 1;
        white-space: nowrap; text-transform: uppercase; color: #f2ecdf; opacity: 0; }

      #hook { position: absolute; left: 50px; right: 50px; top: 90px; z-index: 8; transform-origin: 50% 0%; }
      .hl { font-family: "League Gothic"; font-size: 150px; line-height: 0.96; text-align: center; text-transform: uppercase; white-space: nowrap;
        color: #f2ecdf; text-shadow: 0 8px 30px rgba(0,0,0,0.5); }
      .read .hl { color: #191713; text-shadow: none; }
      .read .hl .g { color: #0f7a45; }

      .cap { position: absolute; left: 40px; right: 40px; top: 1540px; height: 260px; z-index: 6; }
      .capin { position: absolute; left: 0; right: 0; top: 0; text-align: center; font-family: "League Gothic"; font-size: 170px; line-height: 1;
        white-space: nowrap; color: #f2ecdf; -webkit-text-stroke: 14px #0a1424; paint-order: stroke fill;
        text-shadow: 0 10px 40px rgba(0,0,0,0.6); }
      .cw { display: inline-block; margin: 0 0.1em; }
      .cw.em { color: #f2ecdf; }

      .mpage { position: absolute; left: 70px; right: 70px; top: 420px; height: 640px; overflow: hidden; z-index: 1;
        -webkit-mask-image: linear-gradient(#000 78%, transparent 100%); mask-image: linear-gradient(#000 78%, transparent 100%); }
      .mscroll { position: absolute; left: 0; right: 0; top: 0; }
      .mpage p { font-family: "Newsreader"; font-weight: 450; font-size: 60px; line-height: 1.36; color: #191713; margin-bottom: 30px; }
      .mpage .w { color: rgba(25,23,19,0.3); border-radius: 6px; }

      #end { position: absolute; inset: 0; z-index: 30; }
      #endbg { position: absolute; inset: 0; background: #0a1424; }
      #endin { position: absolute; left: 0; right: 0; top: 520px; display: flex; flex-direction: column; align-items: center; }
      .elogo1 { font-family: "League Gothic"; font-size: 330px; line-height: 0.9; }
      .elogo2 { font-family: "League Gothic"; font-size: 210px; line-height: 0.9; color: #f2ecdf; }
      .ecta { margin-top: 70px; font-family: "Space Mono"; font-weight: 700; font-size: 44px; letter-spacing: 0.12em; color: #0a1424; background: #39d98a;
        padding: 14px 34px; border-radius: 999px; }
    </style>
  </head>
  <body>
    <div id="root" class="{{READCLS}}" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="{{TOTAL}}">
      {{BG}}
      {{ELEMENTS}}
      {{PERSON}}
      <div id="hook">{{HOOK}}</div>
      <div id="prog"></div>
      <div id="end" class="clip" data-start="{{SPEECH}}" data-duration="{{ENDDUR}}" data-track-index="9">
        <div id="endbg"></div>
        <div id="endin">
          <div class="elogo1"><span style="color:#3b7bff">YOUR</span> <span class="g">CH</span></div>
          <div class="elogo2">CHANNEL</div>
          <div class="ecta">FULL REVIEW ON THE CHANNEL</div>
        </div>
      </div>
      {{AUDIO}}
    </div>
    <script>
      document.fonts.ready.then(function () {
        var H = window.__hyperframes;
        document.querySelectorAll("[data-fit]").forEach(function (el) {
          if (!H || !H.fitTextFontSize) return;
          var cs = getComputedStyle(el);
          var base = parseFloat(cs.fontSize);
          var r = H.fitTextFontSize(el.getAttribute("data-fit").toUpperCase(), {
            fontFamily: cs.fontFamily.split(",")[0].replace(/["']/g, "").trim(),
            fontWeight: 400, maxWidth: parseFloat(el.getAttribute("data-fitw") || "960"),
            baseFontSize: base, minFontSize: 60, step: 4,
          });
          if (r && r.fontSize && r.fontSize < base) el.style.fontSize = r.fontSize + "px";
        });
        var tl = gsap.timeline({ paused: true });
{{TIMELINE}}
        window.__timelines["main"] = tl;
      });
    </script>
  </body>
</html>
